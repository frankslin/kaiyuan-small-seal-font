<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開元小篆 · 試排</title>
<!--
  Test page: type modern Chinese, convert it to Seal block code points with
  opencc-js (seal.js, experimental since 1.5.0) and set it in the font built by
  scripts/build_font.py. Serve the repository root and open /app/:

      python3 scripts/build_font.py && python3 -m http.server 8766
      open http://127.0.0.1:8766/app/

  The font is read from ../build/, which is not committed.
-->
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.5.0-beta.0/dist/umd/full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.5.0-beta.0/dist/umd/seal.js"></script>
<style>
@font-face { font-family: "Kaiyuan Small Seal"; src: url("../build/KaiyuanSmallSeal-Regular.woff2") format("woff2"), url("../build/KaiyuanSmallSeal-Regular.ttf") format("truetype"); font-display: block; }
:root { --paper: #f6f1e4; --ink: #1d1a16; --faint: #8d8371; --line: #d8cfba; --seal: #a5281b; --card: #fffdf7; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 "Songti TC", "Noto Serif CJK TC", "Source Han Serif TC", serif; }
header { display: flex; align-items: baseline; gap: 14px; padding: 18px 28px 10px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 22px; letter-spacing: .12em; }
header h1 b { color: var(--seal); font-weight: 600; }
header span { color: var(--faint); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 24px; padding: 22px 28px 40px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
label.t { display: block; font-size: 12px; letter-spacing: .2em; color: var(--faint); margin: 0 0 6px; }
textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); font: inherit; font-size: 17px; resize: vertical; }
textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--seal); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 12px 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 6px 12px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--paper); }
button.plain { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
.samples button { border: 0; background: none; color: var(--seal); padding: 0; font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
input[type=range] { accent-color: var(--seal); }
#sheet { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 28px; min-height: 360px; overflow: auto; }
#out { font-size: var(--size, 72px); line-height: 1.25; word-break: break-all; }
#out.vertical { writing-mode: vertical-rl; height: min(70vh, 640px); }
#out span { display: inline-block; position: relative; cursor: default; vertical-align: middle; }
#out .seal { font-family: "Kaiyuan Small Seal"; }
#out .plain { color: var(--faint); font-size: .62em; }
#out .todo { color: var(--seal); font-size: .62em; border: 1px dashed var(--seal); border-radius: 4px; padding: 0 .1em; }
#out .seal:hover { color: var(--seal); }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); font: 12px/1.5 ui-monospace, monospace; padding: 5px 9px; border-radius: 4px; opacity: 0; transition: opacity .12s; z-index: 5; white-space: pre; }
#stat { color: var(--faint); font-size: 13px; margin-top: 10px; }
#codes { margin-top: 10px; font: 12px/1.7 ui-monospace, monospace; color: var(--faint); word-break: break-all; user-select: all; }
.note { color: var(--faint); font-size: 12.5px; margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
#fonterr { color: var(--seal); font-size: 13px; }
</style>

<header>
  <h1><b>開元</b>小篆 · 試排</h1>
  <span>opencc-js 1.5.0-beta.0 <code>seal.js</code> ＋ Kaiyuan Small Seal</span>
</header>
<main>
  <section>
    <label class="t" for="in">輸入</label>
    <textarea id="in" spellcheck="false">朕能吞下玻璃而不伤身体</textarea>
    <div class="row">
      <span class="seg" id="mode">
        <button data-from="cn" data-to="seal" class="on">簡 → 篆</button><button data-from="t" data-to="seal">繁 → 篆</button><button data-from="seal" data-to="t">篆 → 繁</button>
      </span>
    </div>
    <div class="row samples">
      <span style="color:var(--faint);font-size:13px">例句</span>
      <button>天地玄黃，宇宙洪荒</button><button>道可道，非常道</button><button>學而時習之，不亦說乎</button><button>朕能吞下玻璃而不伤身体</button>
    </div>
    <p class="note">灰色小字：《說文》沒有這個字，opencc-js 原樣保留。紅色虛線框：有篆書碼位，但字型裡還沒有這個字形。滑鼠移到篆字上可看碼位與對應的楷書。</p>
  </section>
  <section>
    <div class="row" style="margin-top:0">
      <label class="t" style="margin:0">輸出</label>
      <span class="seg" id="dir"><button data-v="0" class="on">橫排</button><button data-v="1">直排</button></span>
      <input id="size" type="range" min="28" max="160" value="72" aria-label="字級">
      <button class="plain" id="copy">複製篆書碼位文字</button>
      <span id="fonterr"></span>
    </div>
    <div id="sheet"><div id="out" lang="zh-Hant"></div></div>
    <div id="stat"></div>
    <div id="codes"></div>
  </section>
</main>
<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const isSeal = cp => cp >= 0x3D000 && cp <= 0x3FC3F;
let from = 'cn', to = 'seal', covered = null, converted = '';
const converters = {};
const convert = text => (converters[from + to] ||= OpenCCSeal.Converter({from, to}))(text);
const back = OpenCCSeal.Converter({from: 'seal', to: 't'});

function render() {
  const text = $('#in').value;
  converted = convert(text);
  const out = $('#out'); out.textContent = '';
  let seals = 0, plain = 0, todo = 0;
  for (const ch of converted) {
    const cp = ch.codePointAt(0), span = document.createElement('span');
    if (ch === '\n') { out.append(document.createElement('br')); continue; }
    if (isSeal(cp)) {
      const hex = cp.toString(16).toUpperCase();
      if (covered && !covered.has(hex)) { span.className = 'todo'; span.textContent = back(ch); todo++; }
      else { span.className = 'seal'; span.textContent = ch; seals++; }
      span.dataset.tip = `U+${hex}  ${back(ch)}`;
    } else {
      span.className = to === 'seal' && /\p{Script=Han}/u.test(ch) ? 'plain' : '';
      if (span.className) plain++;
      span.textContent = ch;
    }
    out.append(span);
  }
  $('#stat').textContent = to === 'seal'
    ? `篆字 ${seals}` + (todo ? ` · 字型尚缺 ${todo}` : '') + (plain ? ` · 《說文》未收 ${plain}` : '')
    : `${[...converted].length} 字`;
  $('#codes').textContent = to === 'seal' ? [...converted].filter(c => isSeal(c.codePointAt(0))).map(c => 'U+' + c.codePointAt(0).toString(16).toUpperCase()).join(' ') : '';
}

$('#in').addEventListener('input', render);
$('#mode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  // going the other way, carry the result over so a round trip is one click
  if ((b.dataset.from === 'seal') !== (from === 'seal')) $('#in').value = converted;
  from = b.dataset.from; to = b.dataset.to;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('#dir').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  $('#out').classList.toggle('vertical', b.dataset.v === '1');
  document.querySelectorAll('#dir button').forEach(x => x.classList.toggle('on', x === b)); });
$('#size').addEventListener('input', e => $('#out').style.setProperty('--size', e.target.value + 'px'));
document.querySelectorAll('.samples button').forEach(b => b.addEventListener('click', () => {
  $('#in').value = b.textContent;
  if (from === 'seal') $('#mode button').click(); else render(); }));
$('#copy').addEventListener('click', async () => { await navigator.clipboard.writeText(converted); $('#copy').textContent = '已複製'; setTimeout(() => $('#copy').textContent = '複製篆書碼位文字', 1200); });
$('#out').addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'), tip = $('#tip');
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 16 + 'px'; tip.style.opacity = 1; });
$('#out').addEventListener('mouseleave', () => $('#tip').style.opacity = 0);

fetch('../build/coverage.json').then(r => r.ok ? r.json() : null).then(list => { if (list) { covered = new Set(list); render(); } }).catch(() => {});
document.fonts.load('48px "Kaiyuan Small Seal"', '\u{3D000}').then(f => { if (!f.length) $('#fonterr').textContent = '找不到 ../build/KaiyuanSmallSeal-Regular.woff2（或 .ttf），請先執行 scripts/build_font.py'; });
render();
</script>
</html>
