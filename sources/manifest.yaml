# Scan sources. This is the only place that names scans; see docs/technical-roadmap.md §1.3.
# Nothing under sources/cache/ is committed.
#
# render_width must be one of the Commons thumbnail steps (… 960, 1280, 1920, 3840).
# Page numbers are 1-based PDF pages. In a `pages` block, `first_side`/`last_side`
# say on which half of the first/last image the 卷 begins/ends (default: right/left,
# i.e. the whole image), and `radicals` is the inclusive range of kSEAL_Rad numbers
# the block covers, from which the expected seal count is derived.

user_agent: "kaiyuan-small-seal-font/0.1 (https://github.com/frankslin/kaiyuan-small-seal-font)"
default_render_width: 1920

